name: 🧪 Companion Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run test suite
        run: pytest -q
      - name: Report test success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"success","context":"companion-tests","description":"compileall and pytest passed","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
      - name: Report test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"failure","context":"companion-tests","description":"compileall or pytest failed","target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
