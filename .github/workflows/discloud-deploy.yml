name: 🚀 Discloud Production Auto-Deploy

on:
  workflow_run:
    workflows: ["🧪 Companion Test Suite"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discloud-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to Discloud
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Repository Source Files
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: 📦 Create Discloud Deployment Bundle
        run: |
          zip -r deploy.zip *.py data discloud.config requirements.txt

      - name: ⚡ Upload Bundle to Discloud
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          test -n "$DISCLOUD_TOKEN"
          curl --fail-with-body -X PUT "https://discloudbot.com" \
            -H "api-token: $DISCLOUD_TOKEN" \
            -F "file=@deploy.zip"
