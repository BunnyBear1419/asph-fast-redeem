name: 🚀 Discloud Production Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discloud-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: 🧪 Validate before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        run: pytest -q

  deploy:
    name: 🚀 Deploy to Discloud
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Source Files
        uses: actions/checkout@v4.2.2

      - name: 📦 Create Discloud Deployment Bundle
        run: |
          zip -r deploy.zip *.py data discloud.config requirements.txt

      - name: ⚡ Upload Bundle to Discloud
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          test -n "$DISCLOUD_TOKEN"
          curl --fail-with-body -X PUT "https://discloudbot.com" \
            -H "api-token: $DISCLOUD_TOKEN" \
            -F "file=@deploy.zip"
